<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Team Portal · ระบบข้อมูลฝ่ายบริการ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">

<!--
  ============================================================
  CS TEAM PORTAL — คู่มือแก้ไขโค้ดอย่างย่อ
  ============================================================
  ไฟล์นี้แบ่งเป็น 3 ส่วน: CSS → HTML → JavaScript

  อยากแก้อะไร ไปที่ไหน
  - สี / โหมดมืด ........ CSS ส่วนที่ 1 (ตัวแปร --pri, --bg ฯลฯ)
  - ชื่อโรงเรียน ......... JS ส่วน A (CONFIG.schoolName) และ HTML (.brand)
  - ภาคเรียน/คาบ/เวลา ..... JS ส่วน A (CONFIG)
  - ตารางเรียน/รายวิชา/ครู . JS ส่วน B2 (TIMETABLES, COURSES, TEACHERS)
  - ข้อมูลนักเรียน ........ JS ส่วน B (STUDENT_ROWS — นำเข้าจากไฟล์ Excel แล้ว)
  - หน้าตารางนักเรียน ..... JS ส่วน E (renderStudents)
  - หน้าตารางเรียน ........ JS ส่วน E (renderTimetable)
  - บัตรข้อมูลเชิงลึก ..... JS ส่วน E (openStudentCard)
-->

<style>
/* ============================================================
   1. ตัวแปรสี (Design Tokens) — แก้สีทั้งเว็บได้ที่นี่
   ============================================================ */
:root {
  --bg:      #f4f6fb;   /* พื้นหลังหน้า */
  --surface: #ffffff;   /* พื้นการ์ด */
  --surface2:#f0f3fa;   /* พื้นรอง (หัวตาราง ฯลฯ) */
  --text:    #17203a;
  --muted:   #667089;
  --border:  #e2e7f2;
  --primary: #3b5bdb;   /* สีหลัก */
  --primary2:#5f7cf5;   /* สีหลักอ่อน (ใช้ทำ gradient) */
  --primary-soft:#e8edff;
  --shadow: 0 1px 2px rgba(23,32,58,.06), 0 8px 24px rgba(23,32,58,.06);

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* โหมดมืดตามค่าเครื่อง (ยกเว้นผู้ใช้กดบังคับโหมดสว่าง) */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0f1424; --surface:#171d33; --surface2:#1e2640;
    --text:#e8ecf8; --muted:#98a2c0; --border:#2a3350;
    --primary:#7b93ff; --primary2:#5f7cf5; --primary-soft:#232d57;
    --shadow: 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
/* โหมดมืดเมื่อผู้ใช้กดปุ่มสลับเอง */
:root[data-theme="dark"] {
  --bg:#0f1424; --surface:#171d33; --surface2:#1e2640;
  --text:#e8ecf8; --muted:#98a2c0; --border:#2a3350;
  --primary:#7b93ff; --primary2:#5f7cf5; --primary-soft:#232d57;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

/* ============================================================
   2. พื้นฐาน
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
h1 { font-size: 22px; margin: 0; }
.sub  { color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 12px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow);
}

/* ============================================================
   3. โครงหน้า: Sidebar + เนื้อหา
   ============================================================ */
.app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

aside {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 6px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 8px 18px; }
.brand b { display: block; line-height: 1.2; }
.brand small { color: var(--muted); }
.logo {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), var(--primary2));
  display: grid; place-items: center;
  color: #fff; font-weight: 700;
}

/* ปุ่มเมนูใน sidebar */
.nav {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 10px 12px;
  border: 0; border-radius: 10px; background: none;
  color: var(--muted); font-weight: 500; text-align: left; cursor: pointer;
}
.nav:hover { background: var(--surface2); }
.nav.on    { background: var(--primary-soft); color: var(--primary); }
.nav svg   { width: 18px; height: 18px; flex: none; }

.side-foot {
  margin-top: auto; padding: 8px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}

main { padding: 22px 28px 40px; min-width: 0; }
.top {
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
  flex-wrap: wrap; margin-bottom: 20px;
}

/* ช่องค้นหา */
.search { position: relative; flex: 1; max-width: 420px; min-width: 220px; }
.search input {
  width: 100%; padding: 11px 14px 11px 40px;
  border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface); outline: none;
}
.search svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--muted); }
.search input:focus, select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}

/* ============================================================
   4. คอมโพเนนต์หน้า "ข้อมูลนักเรียน"
   ============================================================ */
/* การ์ดสถิติ */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat  { padding: 14px 16px; }
.stat span { color: var(--muted); font-size: 12px; }
.stat b    { display: block; font-size: 24px; }

/* แถบเครื่องมือ + ปุ่มสลับโหมด */
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface2); padding: 4px; border-radius: 12px; gap: 2px; }
.seg button {
  border: 0; background: none; padding: 7px 14px;
  border-radius: 9px; cursor: pointer; color: var(--muted); font-weight: 500;
}
.seg button.on { background: var(--surface); color: var(--primary); box-shadow: var(--shadow); }

/* ปุ่มเลือกชั้น (ม.1 – ม.6) */
.label { font-size: 12px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--border); background: var(--surface);
  padding: 7px 14px; border-radius: 9px; cursor: pointer;
  color: var(--muted); font-weight: 500;
}
.chip:hover { border-color: var(--primary); }
.chip.on    { background: var(--primary); border-color: var(--primary); color: #fff; }

/* การ์ดเลือกห้อง */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
.room {
  padding: 14px; text-align: left; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); border-radius: 14px;
}
.room:hover { border-color: var(--primary); transform: translateY(-1px); }
.room.on    { border-color: var(--primary); background: var(--primary-soft); }
.room b     { display: block; font-size: 20px; }
.room span  { color: var(--muted); font-size: 12px; }

/* ตารางรายชื่อ */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  padding: 11px 16px; background: var(--surface2);
  font-size: 12px; font-weight: 600; color: var(--muted);
  text-align: left; white-space: nowrap;
}
td { padding: 11px 16px; border-top: 1px solid var(--border); white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--primary-soft); }
.col-no   { width: 70px; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-name { font-weight: 600; color: var(--primary); }
.tag {
  display: inline-block; padding: 2px 9px; border-radius: 99px;
  background: var(--primary-soft); color: var(--primary);
  font-size: 12px; font-weight: 600;
}
.tag-warn { background: #fde4e4; color: #a02929; margin-left: 6px; }
.missing { opacity: .6; font-weight: 400; }
.empty { padding: 44px; text-align: center; color: var(--muted); }

/* ============================================================
   5. คอมโพเนนต์หน้า "ตารางเรียน"
   ============================================================ */
select {
  padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); outline: none;
}
.tt { min-width: 1120px; table-layout: fixed; }
.tt th, .tt td { text-align: center; padding: 6px; border: 1px solid var(--border); }
.tt th { font-size: 12px; }
.th-time { font-weight: 400; color: var(--muted); }
.tt td.day { width: 84px; font-weight: 700; }
.cell {                                  /* กล่องวิชา 1 คาบ (ปุ่มกดได้) */
  display: block; width: 100%; min-height: 66px; padding: 8px 10px; overflow: hidden; white-space: normal;
  text-align: left; font: inherit; font-size: 13px; font-weight: 600; line-height: 1.25;
  border: 0; border-left: 4px solid transparent; border-radius: 10px; cursor: pointer;
}
button.cell:hover { transform: translateY(-1px); box-shadow: var(--shadow); filter: brightness(.97); }
.cell small { display: block; margin-top: 3px; font-weight: 400; font-size: 11px; opacity: .8; white-space: normal; overflow-wrap: break-word; }
.cell.static { display: grid; place-items: center; text-align: center; cursor: default; font-weight: 500; font-size: 12px; }
.cell.free { background: var(--surface2); color: var(--muted); }
.cell.lunch-cell { background: #fdebd3; color: #8a5a00; border-left: 4px solid #f0a04b; font-weight: 600; }

/* หน้าต่างรายละเอียดรายวิชา */
.c-head { padding: 16px 18px; border-left: 6px solid; border-radius: 14px; }
.c-head h2 { margin: 8px 0 2px; font-size: 20px; line-height: 1.3; }
.c-sec { margin-top: 16px; }
.c-sec h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.c-sec p { margin: 0; }
.c-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 16px; }
.c-info div { padding: 10px 12px; border-radius: 12px; background: var(--surface2); }
.c-info i { display: block; font-style: normal; font-size: 12px; color: var(--muted); }
.c-list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.c-list li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; }
.c-list li.hit { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }

/* ============================================================
   6. หน้าต่างข้อมูลเชิงลึก (Modal + บัตรประชาชน)
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  display: none; place-items: center; padding: 16px;
  background: rgba(10,14,28,.55); backdrop-filter: blur(3px);
}
.overlay.show { display: grid; }
.modal { width: min(640px, 100%); max-height: 92vh; overflow: auto; padding: 18px; }

/* ตัวบัตร — พื้นหลังฟ้าอมเขียวลายละเอียดแบบบัตรประชาชน */
.idcard {
  display: flex; flex-direction: column;
  aspect-ratio: 856 / 540;            /* สัดส่วนบัตร ID-1 (ขยายเองถ้าเนื้อหายาวกว่า) */
  background-size: cover; background-position: center;
  overflow: hidden; border-radius: 16px; border: 1px solid #b9d4e6; color: #16324a;
  background:
    radial-gradient(circle at 85% 15%, rgba(255,255,255,.7), transparent 40%),
    repeating-radial-gradient(circle at 20% 120%, rgba(70,140,170,.10) 0 2px, transparent 2px 9px),
    linear-gradient(135deg, #d7ecf5, #cfe8e0 55%, #e3eef8);
}
.id-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 18px; color: #fff; font-weight: 600;
  background: var(--head-bg, linear-gradient(90deg, #1d4f7c, #2f7ea1));
}
.id-head small { font-weight: 400; opacity: .85; }
.id-body { flex: 1; align-items: center; display: grid; grid-template-columns: 1fr 150px; gap: 14px; padding: 16px 18px 18px; }
.id-label  { font-size: 12px; color: #44657e; }
.id-number { font-size: 22px; font-weight: 700; letter-spacing: .04em; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.field     { margin-bottom: 7px; font-size: 14px; }
.field i   { display: block; font-style: normal; font-size: 12px; line-height: 1.2; color: #44657e; }
.field b   { font-weight: 600; }
.grid2     { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.idcard.photo-left .id-body { grid-template-columns: 150px 1fr; column-gap: 40px; }   /* รูปถ่ายอยู่ซ้าย */
.idcard.photo-left .photo { order: -1; }
.photo {
  width: 150px; height: 186px; overflow: hidden; background: #fff;
  border: 2px solid #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.eye {
  margin-left: 6px; padding: 2px 8px; border: 0; border-radius: 8px;
  background: rgba(255,255,255,.7); color: #1d4f7c; font-size: 12px; cursor: pointer;
}
.modal-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

/* ============================================================
   7. หน้าจอมือถือ
   ============================================================ */
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand, .side-foot { display: none; }
  .nav { width: auto; white-space: nowrap; }
  main { padding: 16px; }
  .id-body, .idcard.photo-left .id-body { grid-template-columns: 1fr; }
  .photo { order: -1; margin: auto; }
}
</style>
</head>

<body>
<!-- ============================================================
     HTML โครงหน้า (เนื้อหาจริงถูกสร้างโดย JavaScript ใน #view)
     ============================================================ -->
<div class="app">

  <!-- Sidebar -->
  <aside>
    <div class="brand">
      <div class="logo">CS</div>
      <div><b>CS Team Portal</b><small>ฝ่ายบริการโรงเรียน</small></div>
    </div>

    <button class="nav on" data-view="students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c2 .6 3.2 2.3 3.5 5"/></svg>
      ข้อมูลนักเรียน
    </button>
    <button class="nav" data-view="timetable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>
      ตารางเรียน
    </button>

    <div class="side-foot">
      ข้อมูลภายในโรงเรียน ห้ามเผยแพร่<br>
      <button class="eye" id="themeBtn" style="margin:8px 0 0">สลับโหมดสี</button>
    </div>
  </aside>

  <!-- เนื้อหาหลัก -->
  <main>
    <div class="top">
      <div>
        <h1 id="pageTitle">ข้อมูลนักเรียน</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" placeholder="ค้นหาชื่อ นามสกุล ชื่อเล่น หรือเลขประจำตัว" autocomplete="off">
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- หน้าต่างบัตรข้อมูลเชิงลึก -->
<div class="overlay" id="overlay"><div class="card modal" id="modal"></div></div>


<script>
/* ============================================================
   A. CONFIG — ค่าที่ปรับแต่งได้ง่าย
   ============================================================ */
const CONFIG = {
  currentBuddhistYear: 2569,

  // ---- รูปถ่ายนักเรียน ----
  // วางไฟล์ไว้ในโฟลเดอร์ photos/ ข้างไฟล์ html แล้วตั้งชื่อตามเลขประจำตัว เช่น photos/13303.jpg
  // ขนาดแนะนำ 600 × 744 px (สัดส่วน ~3:4) JPG ไม่เกิน ~100 KB ต่อรูป
  // นักเรียนคนไหนยังไม่มีรูป ระบบจะแสดงรูปสมมติแทนให้อัตโนมัติ
  photoFolder: "photos/",
  photoExt: ".jpg",

  // ---- พื้นหลังบัตรนักเรียน (การ์ดข้อมูลเชิงลึก) ----
  // ขนาดรูปแนะนำ: 1600 × 1009 px, JPG/WebP ไม่เกิน ~300 KB
  // image  : ชื่อรูปใน CARD_IMAGES (ท้ายไฟล์) หรือที่อยู่ไฟล์ เช่น "images/card-bg.jpg"
  // overlay: ฝ้าขาวทับรูปให้ตัวหนังสืออ่านง่าย (0 = ไม่ทับ, 1 = ขาวล้วน)
  // photoSide: "right" | "left" = ตำแหน่งรูปถ่าย   headerBg: สีแถบหัวบัตร (ว่าง = สีเดิม)
  cardDefault: { image: "", overlay: 0.35, photoSide: "right", headerBg: "" },   // ห้องอื่นๆ ที่ไม่ได้กำหนด
  cardBackgrounds: {                       // กำหนดเฉพาะห้อง  "ชั้น/ห้อง": {...}
    "4/2": { image: "room-4-2", overlay: 0, photoSide: "left",
             headerBg: "linear-gradient(90deg, #e8531f, #f7a21b)" },
    "4/3": { image: "room-4-3", overlay: 0, photoSide: "left",
             headerBg: "linear-gradient(90deg, #0a8f74, #17bfa0)" },
  },
  levels: [4],                            // ชั้นที่มีข้อมูล (เพิ่ม 5, 6 ได้เมื่อมีข้อมูลชั้นนั้น)
  roomsPerLevel: 5,                       // จำนวนห้องต่อชั้น
  semesters: ["2/2569", "1/2569", "2/2568"],       // ตอนนี้มีข้อมูลตารางเฉพาะ 2/2569
  days: ["จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์"],
  homeroom: ["08:00", "08:30"],
  periods: [                              // [เริ่ม, สิ้นสุด] คาบ 1–9 (คาบ 5 = พักกลางวัน)
    ["08:30", "09:20"], ["09:20", "10:10"], ["10:10", "11:00"], ["11:00", "11:50"],
    ["11:50", "12:40"],
    ["12:40", "13:30"], ["13:30", "14:20"], ["14:20", "15:10"], ["15:10", "16:00"],
  ],
  lunchPeriod: 4,                         // ดัชนีคาบพักกลางวัน (เริ่ม 0 → คาบ 5)

/* ============================================================
   C. STATE — สถานะปัจจุบันของหน้าจอ
   ============================================================ */
const state = {
  view: "students",          // "students" | "timetable"
  mode: "room",              // "room" (ดูตามห้อง) | "level" (ดูตามสายชั้น)
  level: 4,
  room: 2,
  query: "",                 // คำค้นหา

};


/* ============================================================
   D. HELPERS — ฟังก์ชันช่วย
   ============================================================ */
const $ = (selector) => document.querySelector(selector);

const escapeHtml = (s) =>
  String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* นับจำนวนนักเรียน (ไม่ใส่ room = นับทั้งชั้น) */
const countStudents = (level, room) =>
  STUDENTS.filter((s) => s.level == level && (!room || s.room == room)).length;

const findStudent = (id) => STUDENTS.find((s) => s.id == id);

const programOf = (level, room) => CONFIG.roomNames[`${level}/${room}`] || "";
const MISSING = '<span class="missing">ไม่มีข้อมูล</span>';

function setHeader(title, subtitle) {
  $("#pageTitle").textContent = title;
  $("#pageSub").textContent = subtitle;
}


/* ============================================================
   E. RENDER — ฟังก์ชันสร้างหน้าจอ (คืนค่าเป็น HTML string)
   ============================================================ */

/* ---- E1. ตารางรายชื่อนักเรียน ----
   showClass = true  → คอลัมน์แรกแสดง "ม.4/2 · เลขที่" (ใช้ตอนดูทั้งสายชั้น/ผลค้นหา)
   showClass = false → คอลัมน์แรกแสดงแค่ "เลขที่" */
function studentTable(list, showClass) {
  if (!list.length) return `<div class="card empty">ไม่พบข้อมูลที่ค้นหา</div>`;

  const rowsHtml = list.map((s) => `
    <tr class="clickable" data-student="${s.id}">
      <td class="col-no">${showClass ? `<span class="tag">ม.${s.level}/${s.room}</span> · ${s.no}` : s.no}</td>
      <td>${s.id}</td>
      <td class="col-name">${escapeHtml(s.firstName)}${s.status !== "ศึกษาอยู่" ? ` <span class="tag tag-warn">${s.status}</span>` : ""}</td>
      <td>${escapeHtml(s.lastName)}</td>
    </tr>`).join("");

  return `
    <div class="card table-wrap"><table>
      <thead><tr>
        <th>${showClass ? "ชั้น/ห้อง · เลขที่" : "เลขที่"}</th>
        <th>เลขประจำตัว</th><th>ชื่อจริง</th><th>นามสกุล</th>
      </tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`;
}

/* ---- E2. หน้า "ข้อมูลนักเรียน" ---- */
function renderStudents() {
  const q = state.query.trim();

  // กรณีกำลังค้นหา: แสดงผลลัพธ์จากทุกห้อง
  if (q) {
    const found = STUDENTS.filter((s) =>
      (s.firstName + " " + s.lastName + " " + s.nickname + " " + s.id).includes(q));
    setHeader("ข้อมูลนักเรียน", `ผลการค้นหา “${q}” พบ ${found.length} รายการ`);
    return studentTable(found.slice(0, 200), true);
  }

  // ส่วนบน: สถิติ + ปุ่มสลับโหมด + เลือกชั้น
  let html = `
    <div class="stats">
      <div class="card stat"><span>นักเรียนทั้งหมด</span><b>${STUDENTS.length}</b></div>
      <div class="card stat"><span>ศึกษาอยู่</span><b>${STUDENTS.filter((s) => s.status === "ศึกษาอยู่").length}</b></div>
      <div class="card stat"><span>ลาออก</span><b>${STUDENTS.filter((s) => s.status !== "ศึกษาอยู่").length}</b></div>
      <div class="card stat"><span>จำนวนห้องเรียน</span><b>${CONFIG.levels.length * CONFIG.roomsPerLevel}</b></div>
    </div>

    <div class="bar"><div class="seg">
      <button data-mode="room"  class="${state.mode == "room"  ? "on" : ""}">ดูตามห้อง</button>
      <button data-mode="level" class="${state.mode == "level" ? "on" : ""}">ดูตามสายชั้น</button>
    </div></div>

    <div class="label">ระดับชั้น</div>
    <div class="chips">
      ${CONFIG.levels.map((l) => `<button class="chip ${state.level == l ? "on" : ""}" data-level="${l}">ม.${l}</button>`).join("")}
    </div>`;

  if (state.mode === "room") {
    // โหมดดูตามห้อง
    const roomNumbers = Array.from({ length: CONFIG.roomsPerLevel }, (_, i) => i + 1);
    html += `
      <div class="label">ห้องเรียน</div>
      <div class="rooms">
        ${roomNumbers.map((r) => `
          <button class="room ${state.room == r ? "on" : ""}" data-room="${r}">
            <b>ม.${state.level}/${r}</b><span>${countStudents(state.level, r)} คน</span><span style="display:block">${programOf(state.level, r)}</span>
          </button>`).join("")}
      </div>`;
    setHeader("ข้อมูลนักเรียน", `รายชื่อนักเรียนชั้น ม.${state.level}/${state.room} · ${countStudents(state.level, state.room)} คน · ${programOf(state.level, state.room)}`);
    html += studentTable(STUDENTS.filter((s) => s.level == state.level && s.room == state.room), false);
  } else {
    // โหมดดูตามสายชั้น
    setHeader("ข้อมูลนักเรียน", `รายชื่อนักเรียนสายชั้น ม.${state.level} ทั้งหมด · ${countStudents(state.level)} คน`);
    html += `<div style="height:14px"></div>` + studentTable(STUDENTS.filter((s) => s.level == state.level), true);
  }
  return html;
}

/* ---- E3. หน้า "ตารางเรียน" ---- */
const SLOT_PERIOD = [0, 1, 2, 3, 5, 6, 7, 8];     // ช่องที่ 1–8 ในข้อมูล → คาบที่ (ดัชนีเริ่ม 0)
const DAY_COLORS = ["#fff4d6", "#ffe9ec", "#e8f5ea", "#ffeedd", "#e8f0ff"];

/* แปลงข้อมูลตารางของห้องหนึ่ง → [วัน][ช่อง] = {course, teacher} หรือ null (ว่าง) */
function getTimetable(semester, room) {
  const rows = (TIMETABLES[semester] || {})[room];
  if (!rows) return null;
  return rows.map((day) => day.trim().split(/\s+/).map((tok) => {
    if (tok === "-") return null;
    const [course, t] = tok.split("@");
    return { course, teacher: t ? TEACHERS[t] : "" };
  }));
}

function renderTimetable() {
  const [level, room] = state.timetableRoom.split("/");
  const allRooms = [];
  for (const l of CONFIG.levels)
    for (let r = 1; r <= CONFIG.roomsPerLevel; r++) allRooms.push(`${l}/${r}`);

  const tt = getTimetable(state.semester, state.timetableRoom);
  setHeader("ค้นหาตารางเรียน", `ตารางเรียน ม.${state.timetableRoom} · ภาคเรียนที่ ${state.semester}`);

  const toolbar = `
    <div class="bar">
      <label class="note">ภาคเรียนที่</label>
      <select id="semesterSelect">
        ${CONFIG.semesters.map((s) => `<option ${s == state.semester ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <label class="note">ห้องเรียน</label>
      <select id="roomSelect">
        ${allRooms.map((r) => `<option value="${r}" ${r == state.timetableRoom ? "selected" : ""}>ม.${r} ${CONFIG.roomNames[r] || ""}</option>`).join("")}
      </select>
      <button class="btn" onclick="print()">พิมพ์ตาราง</button>
    </div>`;

  if (!tt) return toolbar + `<div class="card empty">ยังไม่มีข้อมูลตารางเรียนของภาคเรียน ${state.semester} (เพิ่มได้ที่ TIMETABLES ในส่วน B2)</div>`;

  // หัวตาราง: Homeroom + คาบ 1–9
  const head = `<th>วัน / คาบ</th><th>Homeroom<br><span class="th-time">${CONFIG.homeroom.join("–")}</span></th>` +
    CONFIG.periods.map((t, i) => `<th>คาบ ${i + 1}<br><span class="th-time">${t[0]}–${t[1]}</span></th>`).join("");

  // แถวของแต่ละวัน
  const body = CONFIG.days.map((dayName, d) => {
    let cells = `<td class="day" style="background:${DAY_COLORS[d]}">${dayName}</td><td><div class="cell static free">Homeroom</div></td>`;
    for (let p = 0; p < CONFIG.periods.length; p++) {
      if (p === CONFIG.lunchPeriod) { cells += `<td><div class="cell static lunch-cell">พักกลางวัน</div></td>`; continue; }
      const s = SLOT_PERIOD.indexOf(p), item = tt[d][s];
      if (!item) { cells += `<td><div class="cell static free">ว่าง</div></td>`; continue; }
      const [short, , grp] = COURSES[item.course], [, bg, fg, bd] = GROUPS[grp];
      cells += `<td><button class="cell" data-slot="${d}-${s}" style="background:${bg};color:${fg};border-left-color:${bd}">
        ${short}<small>${item.teacher || "กิจกรรม"}</small></button></td>`;
    }
    return `<tr>${cells}</tr>`;
  }).join("");

  return `${toolbar}
    <div class="card table-wrap"><table class="tt">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody>
    </table></div>
    <p class="note">ม.${state.timetableRoom} ${programOf(level, room)} · นักเรียน ${countStudents(level, room)} คน · คลิกที่ช่องวิชาเพื่อดูรายละเอียดรายวิชา</p>`;
}

/* รวมคาบที่ติดกันของวิชาเดียวกันเป็นช่วงเดียว เช่น จันทร์ คาบ 1–3 */
function courseSessions(tt, courseId) {
  const out = [];
  tt.forEach((day, d) => {
    let cur = null;
    day.forEach((cell, s) => {
      const p = SLOT_PERIOD[s];
      if (cell && cell.course === courseId) {
        if (cur && cur.last + 1 === p) { cur.last = p; cur.slots.push(s); }
        else { cur = { d, first: p, last: p, slots: [s] }; out.push(cur); }
      } else cur = null;
    });
  });
  return out;
}

/* หน้าต่างรายละเอียดรายวิชา (คลิกจากช่องในตาราง) */
function openCourseCard(slotKey) {
  const [d, s] = slotKey.split("-").map(Number);
  const tt = getTimetable(state.semester, state.timetableRoom);
  const item = tt[d][s];
  const [, fullName, grp, desc] = COURSES[item.course];
  const [groupName, bg, fg, bd] = GROUPS[grp];
  const sessions = courseSessions(tt, item.course);
  const total = sessions.reduce((n, x) => n + x.last - x.first + 1, 0);
  const teachers = [...new Set(tt.flat().filter((c) => c && c.course === item.course && c.teacher).map((c) => c.teacher))];
  const timeOf = (x) => `${CONFIG.periods[x.first][0]}–${CONFIG.periods[x.last][1]}`;

  $("#modal").innerHTML = `
    <div class="c-head" style="background:${bg};color:${fg};border-left-color:${bd}">
      <span class="tag" style="background:rgba(255,255,255,.65);color:${fg}">${groupName}</span>
      <h2>${fullName}</h2>
      <div>ม.${state.timetableRoom} ${programOf(...state.timetableRoom.split("/"))} · ภาคเรียนที่ ${state.semester}</div>
    </div>
    <div class="c-sec"><h4>คำอธิบายรายวิชา</h4><p>${desc}</p></div>
    <div class="c-info">
      <div><i>ผู้สอน</i><b>${teachers.join(", ") || "—"}</b></div>
      <div><i>เวลาเรียนรวม</i><b>${total} คาบ/สัปดาห์ (≈ ${(total * 50 / 60).toFixed(1)} ชม.)</b></div>
      <div><i>คาบที่เลือก</i><b>${CONFIG.days[d]} · ${CONFIG.periods[SLOT_PERIOD[s]].join("–")}</b></div>
    </div>
    <div class="c-sec"><h4>ตารางเรียนของวิชานี้</h4><ul class="c-list">
      ${sessions.map((x) => `<li class="${x.d === d && x.slots.includes(s) ? "hit" : ""}">
        <span>${CONFIG.days[x.d]} · ${x.first === x.last ? `คาบ ${x.first + 1}` : `คาบ ${x.first + 1}–${x.last + 1}`}</span><span>${timeOf(x)}</span></li>`).join("")}
    </ul></div>
    <div class="modal-foot"><span class="note">คำอธิบายรายวิชาเป็นข้อความร่าง รอฝ่ายวิชาการตรวจสอบ</span>
      <button class="btn primary" id="closeCard">ปิด</button></div>`;
  $("#closeCard").onclick = closeCard;
  $("#overlay").classList.add("show");
}

/* ---- E4. รูปใบหน้า (SVG สมมติ) ----
   ใช้รูปจริง: return `<img src="${s.photoUrl}" style="width:100%;height:100%;object-fit:cover">` */
function drawAvatar(s) {
  const bg   = `hsl(${s.hue} 40% 85%)`;
  const skin = `hsl(${25 + s.hue % 15} 55% ${62 + s.hue % 12}%)`;
  const hair = `hsl(${s.hue % 40} 25% 16%)`;
  const longHair = s.isFemale
    ? `<path d="M40 80c-6 30-2 58 6 64l6-40zM110 80c6 30 2 58-6 64l-6-40z" fill="${hair}"/>` : "";
  return `
    <svg viewBox="0 0 150 186" width="100%" height="100%">
      <rect width="150" height="186" fill="${bg}"/>
      <path d="M15 186c4-38 30-52 60-52s56 14 60 52z" fill="#fff"/>
      <rect x="64" y="108" width="22" height="30" rx="8" fill="${skin}"/>
      <ellipse cx="75" cy="84" rx="33" ry="38" fill="${skin}"/>
      <path d="M41 82c-4-36 22-50 40-47 24 3 32 22 28 47-4-18-12-26-28-26-14 0-34 4-40 26z" fill="${hair}"/>
      ${longHair}
      <circle cx="62" cy="86" r="3" fill="#2a2a2a"/><circle cx="88" cy="86" r="3" fill="#2a2a2a"/>
      <path d="M66 102q9 7 18 0" stroke="#7a3d33" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>`;
}

/* ---- E4.0 รูปถ่ายนักเรียน ----
   ลำดับการหารูป: PHOTOS[เลขประจำตัว] (ฝัง base64) → ไฟล์ใน photoFolder → รูปสมมติ */
const PHOTOS = {};

function photoHtml(s) {
  const src = PHOTOS[s.id] || (CONFIG.photoFolder ? `${CONFIG.photoFolder}${s.id}${CONFIG.photoExt}` : "");
  if (!src) return drawAvatar(s);
  return `<img src="${src}" alt="" onerror="onPhotoError(this, '${s.id}')"
               style="width:100%;height:100%;object-fit:cover;object-position:top center">`;
}
/* โหลดรูปไม่สำเร็จ (ไม่มีไฟล์) → กลับไปใช้รูปสมมติ */
function onPhotoError(img, id) { img.outerHTML = drawAvatar(findStudent(id)); }

/* ---- E4.1 พื้นหลังบัตร: เลือกตามห้องของนักเรียน (CONFIG.cardBackgrounds) ---- */
const CARD_IMAGES = {};   // เก็บรูปแบบ base64 (ดูท้ายไฟล์)

const cardConfigFor = (s) => CONFIG.cardBackgrounds[`${s.level}/${s.room}`] || CONFIG.cardDefault;

function cardStyle(s) {
  const c = cardConfigFor(s);
  const css = [];
  if (c.headerBg) css.push(`--head-bg:${c.headerBg}`);
  const url = CARD_IMAGES[c.image] || c.image;           // ชื่อรูปใน CARD_IMAGES หรือที่อยู่ไฟล์
  if (url) {
    const tint = c.overlay > 0 ? `linear-gradient(rgba(255,255,255,${c.overlay}),rgba(255,255,255,${c.overlay})),` : "";
    css.push(`background-image:${tint}url('${url}')`, "background-size:cover", "background-position:center");
  }
  return css.join(";");
}

/* ---- E5. หน้าต่างข้อมูลเชิงลึก (บัตรนักเรียน) ---- */
function openStudentCard(studentId) {
  const s = findStudent(studentId);
  let revealed = false;                       // เลขบัตรประชาชน: false = ปกปิด

  function draw() {
    const nationalId = !s.nationalId ? "" : revealed ? s.nationalId : s.nationalId.slice(0, 6) + "••••• •• •";
    $("#modal").innerHTML = `
      <div class="idcard ${cardConfigFor(s).photoSide === "left" ? "photo-left" : ""}" style="${cardStyle(s)}">
        <div class="id-head"><span>บัตรประจำตัวนักเรียน</span><small>Student Identity Card</small></div>
        <div class="id-body">
          <div>
            <div class="id-label">เลขประจำตัวประชาชน ${s.nationalId ? `<button class="eye" id="toggleId">${revealed ? "ซ่อน" : "แสดง"}</button>` : ""}</div>
            <div class="id-number">${nationalId || MISSING}</div>
            <div class="field"><i>ชื่อ-สกุล</i><b style="font-size:17px">${s.prefix} ${escapeHtml(s.firstName)} ${escapeHtml(s.lastName)}</b></div>
            <div class="grid2">
              <div class="field"><i>ชื่อเล่น</i><b>${s.nickname ? escapeHtml(s.nickname) : MISSING}</b></div>
              <div class="field"><i>วันเกิด</i><b>${s.birth || MISSING}</b></div>
              <div class="field" style="grid-column:1/-1"><i>ชั้นเรียน / แผนการเรียน</i><b>มัธยมศึกษาปีที่ ${s.level}/${s.room} · ${programOf(s.level, s.room)}</b></div>
              <div class="field"><i>เลขที่</i><b>${s.no}</b></div>
              <div class="field"><i>เลขประจำตัวนักเรียน</i><b>${s.id}</b></div>
              <div class="field"><i>สถานะ</i><b>${s.status}</b></div>
            </div>
          </div>
          <div class="photo">${photoHtml(s)}</div>
        </div>
      </div>
      <div class="modal-foot">
        <span class="note">ข้อมูลภายในโรงเรียน · เลขบัตรถูกปกปิดโดยค่าเริ่มต้น</span>
        <span>
          <button class="btn" id="goTimetable">ดูตารางเรียน</button>
          <button class="btn primary" id="closeCard">ปิด</button>
        </span>
      </div>`;

    if (s.nationalId) $("#toggleId").onclick = () => { revealed = !revealed; draw(); };
    $("#closeCard").onclick   = closeCard;
    $("#goTimetable").onclick = () => {
      state.view = "timetable";
      state.timetableRoom = `${s.level}/${s.room}`;
      closeCard();
      render();
    };
  }

  draw();
  $("#overlay").classList.add("show");
}

const closeCard = () => $("#overlay").classList.remove("show");

/* ---- E6. ตัวหลัก: วาดหน้าตาม state ---- */
function render() {
  const isStudents = state.view === "students";
  $("#searchBox").style.visibility = isStudents ? "visible" : "hidden";
  $("#view").innerHTML = isStudents ? renderStudents() : renderTimetable();
  document.querySelectorAll(".nav").forEach((b) =>
    b.classList.toggle("on", b.dataset.view === state.view));
}


/* ============================================================
   F. EVENTS — การโต้ตอบของผู้ใช้
   ============================================================ */

/* คลิก: ใช้ data-attribute บนปุ่มเพื่อบอกว่าต้องทำอะไร */
document.addEventListener("click", (e) => {
  if (e.target.id === "overlay") closeCard();               // คลิกพื้นหลังเพื่อปิด

  const el = e.target.closest("[data-view],[data-mode],[data-level],[data-room],[data-student],[data-slot]");
  if (!el) return;
  const d = el.dataset;

  if      (d.view)    state.view  = d.view;                  // เมนู sidebar
  else if (d.mode)    state.mode  = d.mode;                  // ดูตามห้อง/สายชั้น
  else if (d.level)   state.level = +d.level;               // เลือกชั้น
  else if (d.room)    state.room  = +d.room;                 // เลือกห้อง
  else if (d.student) return openStudentCard(d.student);     // คลิกชื่อนักเรียน
  else if (d.slot)    return openCourseCard(d.slot);         // คลิกวิชาในตารางเรียน

  render();
});

/* เปลี่ยนค่า dropdown ในหน้าตารางเรียน */
document.addEventListener("change", (e) => {
  if (e.target.id === "semesterSelect") state.semester = e.target.value;
  else if (e.target.id === "roomSelect") state.timetableRoom = e.target.value;
  else return;
  render();
});

/* พิมพ์ค้นหา */
$("#searchInput").addEventListener("input", (e) => {
  state.query = e.target.value;
  state.view = "students";
  render();
});

/* กด Esc ปิดหน้าต่างบัตร */
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCard(); });

/* ปุ่มสลับโหมดสี */
$("#themeBtn").onclick = () => {
  const root = document.documentElement;
  const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const current = root.dataset.theme || (systemDark ? "dark" : "light");
  root.dataset.theme = current === "dark" ? "light" : "dark";
};


/* ============================================================
   G. START
   ============================================================ */
render();
</script>
